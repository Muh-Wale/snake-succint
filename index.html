<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            margin: 0;
            background: #fe11c5;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            text-align: center;
            overflow-x: hidden;
        }

        #game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        canvas {
            max-width: 100%;
            max-height: 80vh;
            margin-top: 50px;
            border: 4px solid #fe11c5;
            background-color: #2a0025;
        }

        #gameOverModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        #gameOverContent {
            background: #fe11c5;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px #fe11c5;
            max-width: 90%;
        }

        #gameOverContent h1 {
            margin: 0;
            font-size: 48px;
        }

        #gameOverContent p {
            font-size: 24px;
            margin: 10px 0;
        }

        #restartBtn {
            background-color: #c70099;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        #mobileControls {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 300px;
            text-align: center;
            z-index: 1000;
        }

        #mobileControls .row {
            margin: 8px 0;
        }

        #mobileControls button {
            background-color: #fe11c5;
            border: none;
            color: white;
            font-size: 24px;
            padding: 16px;
            margin-bottom: 0px;
            margin-right: 10px;
            margin-left: 10px;
            border-radius: 12px;
            box-shadow: 0 0 10px #fe11c5;
            cursor: pointer;
            width: 60px;
        }

        @media only screen and (max-width: 768px) {
            #mobileControls {
                display: block;
            }

            #game-container {
                min-height: calc(100vh - 150px);
            }

            canvas {
                width: 100%;
                height: auto;
                margin-top: 25px;
                aspect-ratio: 1/1;
            }

            #gameOverContent h1 {
                font-size: 32px;
            }

            #gameOverContent p {
                font-size: 18px;
            }
        }
    </style>
</head>

<body class="game-container">
    <canvas id="snake" width="768" height="608"></canvas>

    <div id="mobileControls">
        <div class="direction-controls">
            <button data-dir="UP">⬆️</button>
            <div>
                <button data-dir="LEFT">⬅️</button>
                <button data-dir="PAUSE">⏸️</button>
                <button data-dir="RIGHT">➡️</button>
            </div>
            <button data-dir="DOWN">⬇️</button>
        </div>
    </div>

    <div id="gameOverModal">
        <div id="gameOverContent">
            <h1>Game Over</h1>
            <p>Your Score: <span id="finalScore"></span></p>
            <button id="restartBtn">Restart Game</button>
        </div>
    </div>

    <script src="snake.js"></script>
</body>

</html>
