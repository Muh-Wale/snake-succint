<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Snake Game</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #fe11c5, #c70099);
            font-family: 'Segoe UI', sans-serif;
            color: white;
            text-align: center;
        }

        canvas {
            display: block;
            margin: 30px auto;
            border: 4px solid #fe11c5;
            background-color: #2a0025;
        }

        #gameOverModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        #gameOverContent {
            background: #fe11c5;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px #fe11c5;
        }

        #gameOverContent h1 {
            margin: 0;
            font-size: 48px;
        }

        #gameOverContent p {
            font-size: 24px;
            margin: 10px 0;
        }

        #restartBtn {
            background-color: #c70099;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
        }

        #mobileControls {
            display: none;
            position: fixed;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 1000;
        }

        #mobileControls .row {
            margin: 8px 0;
        }

        #mobileControls button {
            background-color: #fe11c5;
            border: none;
            color: white;
            font-size: 24px;
            padding: 16px 24px;
            margin: 0 10px;
            border-radius: 12px;
            box-shadow: 0 0 10px #fe11c5;
            cursor: pointer;
            width: 60px;
        }

        @media only screen and (max-width: 768px) {
            #mobileControls {
                display: block;
            }

            canvas,
            #gameOverModal {
                display: none !important;
            }

            body::before {
                content: none;
            }
        }


        @media only screen and (max-width: 768px) {
            #mobileControls {
                display: block;
            }

            canvas {
                display: block;
            }
        }
    </style>
</head>

<body>
    <canvas id="snake" width="768" height="608"></canvas> <!-- 768 = 24 * 32 -->

    <div id="mobileControls">
        <div class="direction-controls">
            <button data-dir="UP">⬆️</button>
            <div>
                <button data-dir="LEFT">⬅️</button>
                <button data-dir="PAUSE">⏸️</button>
                <button data-dir="RIGHT">➡️</button>
            </div>
            <button data-dir="DOWN">⬇️</button>
        </div>
    </div>    

    <div id="gameOverModal">
        <div id="gameOverContent">
            <h1>Game Over</h1>
            <p>Your Score: <span id="finalScore"></span></p>
            <button id="restartBtn">Restart Game</button>
        </div>
    </div>

    <script src="snake.js"></script>
</body>

</html>
